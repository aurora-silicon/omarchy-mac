# Installer identity and hosting: the only place these values are set.
# Packaging, release scripts, tests and the Swift build (through the
# OmarchyInstallerIdentityPlugin) all read this file, so changing a value here
# and rebuilding changes the app. Regenerate Release/release.json with
# scripts/make-release-descriptor after changing the helper, team or catalog
# base here, or the trust root in Release/trust-root.ed25519.pub; test/all
# checks that it matches both.
#
# Format: NAME="value" lines, comments and blank lines only. Names start with
# INSTALLER_. Values are non-empty and contain no ", \, $ or `.

# App bundle, privileged helper and installer package. The identifiers sit
# under omarchy.org, Omarchy's domain. The app identifier also names the
# helper's state directory (/var/db/<app identifier>), the app's workspace in
# Application Support and the unified-log subsystem; the helper identifier is
# its launchd label, Mach service and PrivilegedHelperTools binary.
INSTALLER_APP_NAME="Omarchy Installer"
INSTALLER_FILE_STEM="Omarchy-Mac-Installer"
INSTALLER_APP_IDENTIFIER="org.omarchy.installer"
INSTALLER_HELPER_IDENTIFIER="org.omarchy.installer.helper"
INSTALLER_PKG_IDENTIFIER="org.omarchy.installer.pkg"
# The app name before the rename: the package removes a leftover copy and
# preclean-m1.sh still recognises it on test Macs.
INSTALLER_LEGACY_APP_NAME="Omarchy MX Mac Installer"
INSTALLER_RECOVERY_APP_NAME="Omarchy Installer"

# Apple Developer team and the Developer ID identities it issued.
INSTALLER_TEAM_ID="T2C384FJBD"
INSTALLER_APP_SIGNING_IDENTITY="Developer ID Application: MARCELO DE BARROS ALCANTARA (T2C384FJBD)"
INSTALLER_PKG_SIGNING_IDENTITY="Developer ID Installer: MARCELO DE BARROS ALCANTARA (T2C384FJBD)"

# Catalog trust root. The app trusts exactly one Ed25519 public key: the 32
# raw bytes of Release/trust-root.ed25519.pub, set nowhere else. Replacing
# that file and regenerating Release/release.json (whose fingerprint pins it)
# is the whole key swap. The private key (the Omacom catalog key) lives in
# the catalog-release GitHub environment of the stopgap repository below as
# CATALOG_SIGNING_KEY; the Keychain service is the owner's backup copy, where
# the operator's catalog-signing tools find it.
INSTALLER_CATALOG_KEY_SERVICE="omacom-catalog-signing-key"

# Channel catalogs the app reads: <catalog base>/catalog-<channel>.signed.json
# for stable, rc and edge. scripts/make-release-descriptor writes them into
# Release/release.json, which is compiled into every signed app, so this
# address must keep working for as long as those apps are in use.
INSTALLER_CATALOG_BASE="https://mac.omarchy.org/v1"

# Until the catalog base's host exists, the Mac catalog workflow publishes
# each channel's signed catalog as the catalog-<channel>.signed.json asset of
# this repository's catalog-<channel> prerelease, replaced in place, and the
# catalogs may pin images and engines from this repository's other
# (immutable) releases. See docs/catalog-release.md.
INSTALLER_CATALOG_STOPGAP_REPO="omacom/omarchy-mac-installer"

# Hosting of the existing publishing tools (scripts/publish-channels,
# publish-m1-release, cutover-wizard). They publish a release stream under the
# stream path of the public base; the MX Mac feeds at the root of the bucket
# belong to the MX Mac installer and nothing here reads, writes or prunes
# them. The app no longer reads this host: its catalogs come from the catalog
# base above. These values move to the catalog base's host when publishing
# does.
INSTALLER_PUBLIC_BASE="https://downloads.aicodelabs.com.au"
INSTALLER_STREAM_PATH="omarchy-mac"
INSTALLER_R2_BUCKET="omarchy-releases"
INSTALLER_R2_ENDPOINT="https://ab85a8b9d88f084e66bf9d4a8ee5cf66.r2.cloudflarestorage.com"
INSTALLER_GITHUB_RELEASE_REPO="maralcbr/omarchy-mx-mac"
INSTALLER_GITHUB_RELEASE_LOGIN="maralcbr"
